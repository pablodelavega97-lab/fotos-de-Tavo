<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fotos de Tavo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Work+Sans:wght@300..700&display=swap" rel="stylesheet">
  <style>
    /* ── Design Tokens ── */
    :root, [data-theme="light"] {
      --color-bg: #f7f6f2;
      --color-surface: #f9f8f5;
      --color-surface-2: #fbfbf9;
      --color-surface-offset: #f3f0ec;
      --color-border: #d4d1ca;
      --color-divider: #dcd9d5;
      --color-text: #28251d;
      --color-text-muted: #7a7974;
      --color-text-faint: #bab9b4;
      --color-primary: #01696f;
      --color-primary-hover: #0c4e54;
      --color-primary-active: #0f3638;
      --color-primary-highlight: #cedcd8;
      --radius-sm: 0.375rem;
      --radius-md: 0.5rem;
      --radius-lg: 0.75rem;
      --radius-xl: 1rem;
      --radius-full: 9999px;
      --shadow-sm: 0 1px 2px oklch(0.2 0.01 80 / 0.06);
      --shadow-md: 0 4px 12px oklch(0.2 0.01 80 / 0.08);
      --shadow-lg: 0 12px 32px oklch(0.2 0.01 80 / 0.12);
      --transition-interactive: 180ms cubic-bezier(0.16, 1, 0.3, 1);
      --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem;
      --space-6: 1.5rem; --space-8: 2rem; --space-12: 3rem; --space-16: 4rem;
      --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
      --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
      --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
      --text-2xl: clamp(2rem, 1.2rem + 2.5vw, 3.5rem);
      --font-display: 'Instrument Serif', Georgia, serif;
      --font-body: 'Work Sans', 'Helvetica Neue', sans-serif;
    }
    [data-theme="dark"] {
      --color-bg: #171614;
      --color-surface: #1c1b19;
      --color-surface-2: #201f1d;
      --color-surface-offset: #1d1c1a;
      --color-border: #393836;
      --color-divider: #262523;
      --color-text: #cdccca;
      --color-text-muted: #797876;
      --color-text-faint: #5a5957;
      --color-primary: #4f98a3;
      --color-primary-hover: #227f8b;
      --color-primary-active: #1a626b;
      --color-primary-highlight: #313b3b;
      --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.2);
      --shadow-md: 0 4px 12px oklch(0 0 0 / 0.3);
      --shadow-lg: 0 12px 32px oklch(0 0 0 / 0.4);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        --color-bg: #171614; --color-surface: #1c1b19; --color-surface-2: #201f1d;
        --color-surface-offset: #1d1c1a; --color-border: #393836; --color-divider: #262523;
        --color-text: #cdccca; --color-text-muted: #797876; --color-text-faint: #5a5957;
        --color-primary: #4f98a3; --color-primary-hover: #227f8b;
        --color-primary-active: #1a626b; --color-primary-highlight: #313b3b;
        --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.2);
        --shadow-md: 0 4px 12px oklch(0 0 0 / 0.3);
        --shadow-lg: 0 12px 32px oklch(0 0 0 / 0.4);
      }
    }

    /* ── Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
    body {
      min-height: 100dvh;
      font-family: var(--font-body);
      font-size: var(--text-base);
      color: var(--color-text);
      background: var(--color-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-8) var(--space-4);
    }
    img { display: block; max-width: 100%; height: auto; }
    button { cursor: pointer; background: none; border: none; font: inherit; color: inherit; }
    a, button { transition: color var(--transition-interactive), background var(--transition-interactive), box-shadow var(--transition-interactive); }
    :focus-visible { outline: 2px solid var(--color-primary); outline-offset: 3px; border-radius: var(--radius-sm); }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }

    /* ── Header / Nav ── */
    .site-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--space-3) var(--space-6);
      background: oklch(from var(--color-bg) l c h / 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid oklch(from var(--color-text) l c h / 0.08);
    }
    .logo {
      display: flex; align-items: center; gap: var(--space-2);
      font-family: var(--font-display); font-size: var(--text-lg);
      color: var(--color-text); text-decoration: none;
    }
    .theme-toggle {
      display: flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; border-radius: var(--radius-full);
      color: var(--color-text-muted);
    }
    .theme-toggle:hover { color: var(--color-text); background: oklch(from var(--color-text) l c h / 0.06); }

    /* ── Main Card ── */
    .card {
      background: var(--color-surface);
      border: 1px solid oklch(from var(--color-text) l c h / 0.1);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-md);
      padding: var(--space-8);
      max-width: 520px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-6);
      margin-top: var(--space-16);
    }
    .card-title {
      font-family: var(--font-display);
      font-size: var(--text-2xl);
      color: var(--color-text);
      text-align: center;
      line-height: 1.15;
    }
    .card-subtitle {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      text-align: center;
    }

    /* ── Photo Frame ── */
    .photo-frame {
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: var(--color-surface-offset);
      border: 1px solid oklch(from var(--color-text) l c h / 0.08);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .photo-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-3);
      color: var(--color-text-faint);
      font-size: var(--text-sm);
    }
    .photo-placeholder svg { opacity: 0.4; }
    .photo-img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0;
      transform: scale(1.04);
      transition: opacity 420ms cubic-bezier(0.16,1,0.3,1),
                  transform 420ms cubic-bezier(0.16,1,0.3,1);
      pointer-events: none;
    }
    .photo-img.visible {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    /* ── Buttons ── */
    .btn-row {
      display: flex;
      gap: var(--space-3);
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      display: inline-flex; align-items: center; gap: var(--space-2);
      padding: 0.6em 1.4em;
      border-radius: var(--radius-full);
      font-size: var(--text-sm); font-weight: 500;
      border: 1.5px solid transparent;
      transition: background var(--transition-interactive),
                  color var(--transition-interactive),
                  box-shadow var(--transition-interactive),
                  border-color var(--transition-interactive),
                  transform 120ms ease;
      min-width: 44px; min-height: 44px;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: var(--color-primary);
      color: #fff;
      box-shadow: var(--shadow-sm);
    }
    .btn-primary:hover { background: var(--color-primary-hover); box-shadow: var(--shadow-md); }
    .btn-primary:active { background: var(--color-primary-active); }
    .btn-secondary {
      background: var(--color-surface-2, var(--color-surface));
      color: var(--color-text-muted);
      border-color: oklch(from var(--color-text) l c h / 0.12);
    }
    .btn-secondary:hover { color: var(--color-text); background: var(--color-surface-offset); }

    /* ── Caption ── */
    .caption {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      text-align: center;
      min-height: 1.4em;
      transition: opacity 300ms;
    }

    /* ── Thumbnail Strip ── */
    .thumbnails {
      display: flex;
      gap: var(--space-2);
      flex-wrap: wrap;
      justify-content: center;
    }
    .thumb {
      width: 52px; height: 52px;
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      transition: border-color var(--transition-interactive), box-shadow var(--transition-interactive), transform 120ms ease;
      background: var(--color-surface-offset);
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb:hover { border-color: var(--color-primary); transform: scale(1.06); }
    .thumb.active { border-color: var(--color-primary); box-shadow: 0 0 0 3px var(--color-primary-highlight); }

    @media (max-width: 480px) {
      .card { padding: var(--space-6) var(--space-4); }
      .card-title { font-size: clamp(1.5rem, 6vw, 2rem); }
    }
  </style>
</head>
<body>

<!-- Header -->
<header class="site-header">
  <a href="#" class="logo" aria-label="Inicio">
    <svg aria-hidden="true" width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="3" y="3" width="22" height="22" rx="5" stroke="currentColor" stroke-width="1.8"/>
      <circle cx="10" cy="10.5" r="2" fill="currentColor" opacity="0.7"/>
      <path d="M3 18.5L9.5 13L14 17L18.5 11.5L25 18.5" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    </svg>
    Fotos de Tavo
  </a>
  <button class="theme-toggle" data-theme-toggle aria-label="Cambiar tema">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>
</header>

<!-- Main Card -->
<main>
  <div class="card" role="main">
    <h1 class="card-title">Fotos de Tavo</h1>
    <p class="card-subtitle">Haz clic en un botón para mostrar la imagen</p>

    <!-- Photo Frame -->
    <div class="photo-frame" id="photoFrame" aria-live="polite" aria-label="Área de visualización de foto">
      <div class="photo-placeholder" id="placeholder">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="6" y="10" width="36" height="28" rx="4"/>
          <circle cx="17" cy="20" r="3.5"/>
          <path d="M6 30l10-8 7 7 5-5 14 11"/>
        </svg>
        <span>Ninguna foto seleccionada</span>
      </div>
      <!-- Images will be injected here -->
      <img class="photo-img" id="mainImg" src="" alt="Foto seleccionada" width="520" height="390" loading="lazy"/>
    </div>

    <!-- Thumbnail Strip -->
    <div class="thumbnails" role="list" aria-label="Miniaturas de fotos">
      <!-- thumbs rendered by JS -->
    </div>

    <!-- Action Buttons -->
    <div class="btn-row">
      <button class="btn btn-primary" id="btnMostrar" aria-label="Mostrar foto aleatoria">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <circle cx="9" cy="9" r="2"/>
          <path d="M3 15l6-5 4 4 3-3 8 8"/>
        </svg>
        Ver foto
      </button>
      <button class="btn btn-secondary" id="btnOcultar" aria-label="Ocultar foto" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
        </svg>
        Ocultar
      </button>
    </div>

    <p class="caption" id="caption" aria-live="polite"></p>
  </div>
</main>

<script>
  // ── Theme toggle ──
  (function(){
    const t = document.querySelector('[data-theme-toggle]');
    const r = document.documentElement;
    let d = matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
    r.setAttribute('data-theme', d);
    const sun = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>';
    const moon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
    t.innerHTML = d === 'dark' ? sun : moon;
    t.addEventListener('click', () => {
      d = d === 'dark' ? 'light' : 'dark';
      r.setAttribute('data-theme', d);
      t.innerHTML = d === 'dark' ? sun : moon;
      t.setAttribute('aria-label', 'Cambiar a modo ' + (d === 'dark' ? 'claro' : 'oscuro'));
    });
  })();

  // ── Photo data using Lorem Picsum ──
  const photos = [
    { src: 'https://picsum.photos/seed/mountain/520/390', label: '🏔️ Montaña Nevada', thumb: 'https://picsum.photos/seed/mountain/104/78' },
    { src: 'https://picsum.photos/seed/forest1/520/390', label: '🌲 Bosque Tranquilo', thumb: 'https://picsum.photos/seed/forest1/104/78' },
    { src: 'https://picsum.photos/seed/ocean99/520/390', label: '🌊 Océano Abierto',  thumb: 'https://picsum.photos/seed/ocean99/104/78' },
    { src: 'https://picsum.photos/seed/citynight/520/390', label: '🌃 Ciudad de Noche', thumb: 'https://picsum.photos/seed/citynight/104/78' },
    { src: 'https://picsum.photos/seed/flower22/520/390', label: '🌸 Jardín en Flor', thumb: 'https://picsum.photos/seed/flower22/104/78' },
  ];

  let currentIndex = -1;
  const mainImg    = document.getElementById('mainImg');
  const placeholder = document.getElementById('placeholder');
  const caption    = document.getElementById('caption');
  const btnMostrar = document.getElementById('btnMostrar');
  const btnOcultar = document.getElementById('btnOcultar');
  const thumbsEl   = document.querySelector('.thumbnails');

  // Build thumbnails
  photos.forEach((p, i) => {
    const li = document.createElement('div');
    li.setAttribute('role', 'listitem');
    const btn = document.createElement('button');
    btn.className = 'thumb';
    btn.setAttribute('aria-label', 'Ver ' + p.label);
    btn.innerHTML = `<img src="${p.thumb}" alt="${p.label}" width="52" height="52" loading="lazy">`;
    btn.addEventListener('click', () => showPhoto(i));
    li.appendChild(btn);
    thumbsEl.appendChild(li);
  });

  function getThumbBtns() { return thumbsEl.querySelectorAll('.thumb'); }

  function showPhoto(index) {
    const photo = photos[index];
    currentIndex = index;

    mainImg.src = photo.src;
    mainImg.alt = photo.label;
    placeholder.style.display = 'none';

    // Animate in
    mainImg.classList.remove('visible');
    mainImg.onload = () => {
      requestAnimationFrame(() => mainImg.classList.add('visible'));
    };
    if (mainImg.complete && mainImg.naturalWidth > 0) {
      requestAnimationFrame(() => mainImg.classList.add('visible'));
    }

    caption.textContent = photo.label;
    btnOcultar.disabled = false;

    // Update thumb active state
    getThumbBtns().forEach((b, i) => {
      b.classList.toggle('active', i === index);
    });
  }

  function hidePhoto() {
    mainImg.classList.remove('visible');
    setTimeout(() => {
      mainImg.src = '';
      placeholder.style.display = '';
      caption.textContent = '';
      currentIndex = -1;
      btnOcultar.disabled = true;
      getThumbBtns().forEach(b => b.classList.remove('active'));
    }, 420);
  }

  function randomPhoto() {
    let next = Math.floor(Math.random() * photos.length);
    if (next === currentIndex && photos.length > 1) {
      next = (next + 1) % photos.length;
    }
    showPhoto(next);
  }

  btnMostrar.addEventListener('click', randomPhoto);
  btnOcultar.addEventListener('click', hidePhoto);
</script>
</body>
</html>
